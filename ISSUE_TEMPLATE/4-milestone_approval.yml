name: Milestone approval request
description: Request Chairman validation of a completed milestone.
title: "[Milestone approval]: "
labels: ["governance: approval-required"]
assignees:
  - boutiez
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a milestone is complete. The Chairman reviews it and approves by commenting **"Approved"** and applying the `governance: approved` label. Nothing goes to production before approval.
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Name and link of the GitHub Milestone.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary of what was delivered
      description: Plain language, for a non-technical reader. What can users or the business now do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Planned vs delivered
      placeholder: |
        Planned and delivered: ...
        Deferred (and why): ...
        Added (and why): ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Merged pull requests, demo link or video, screenshots, test results.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Known issues and risks
      description: Open bugs, technical debt taken on, security or fraud concerns.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Requested release
      options:
        - Staging only
        - Production
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness checklist
      options:
        - label: All milestone issues are closed or explicitly moved to a later milestone
          required: true
        - label: No open Critical or High bugs
          required: true
        - label: Tested on staging, on mobile and on a slow connection
          required: true
        - label: No secrets or customer data in the code or history
          required: true
        - label: Documentation and CHANGELOG are updated
          required: true
        - label: A rollback plan exists (required for Production)
  - type: textarea
    id: next
    attributes:
      label: What's next?
      description: Proposed next milestone and priorities.
