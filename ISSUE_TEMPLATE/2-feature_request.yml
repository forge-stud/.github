name: Feature request
description: Propose a new capability or an improvement.
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not the solution. Who struggles today, and how?
    validations:
      required: true
  - type: dropdown
    id: users
    attributes:
      label: Who benefits?
      multiple: true
      options:
        - Merchants and shop owners
        - Retailers
        - Wholesalers
        - End customers
        - fOrge internal team
        - Partners
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      placeholder: |
        - [ ] A merchant can ...
        - [ ] Works offline / on slow connection ...
        - [ ] Available in French ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Must have for the current milestone
        - Should have
        - Nice to have
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
