name: Engineering task
description: A technical task such as setup, refactoring, infrastructure or maintenance.
title: "[Task]: "
labels: ["type: task"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What does this enable or prevent?
  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] ...
        - [ ] Documentation updated
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - Small (under 1 day)
        - Medium (1-3 days)
        - Large (more than 3 days - consider splitting)
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
