name: Bug report
description: Something is not working as expected.
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste passwords, tokens or customer personal data** (names, phone numbers, payment details) in this issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local development
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - service down, or money or data at risk
        - High - major feature broken, no workaround
        - Medium - feature impaired, workaround exists
        - Low - minor or cosmetic
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Tecno Spark 10, Android 13, Chrome"
  - type: dropdown
    id: network
    attributes:
      label: Network conditions
      options:
        - Wi-Fi
        - 4G
        - 3G or slow connection
        - Intermittent or offline
        - Unknown
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Remove any secrets or personal data before pasting.
      render: shell
